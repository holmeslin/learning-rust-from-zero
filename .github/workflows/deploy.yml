name: deployment
on:
  push:
    branches: [main]
  # PR 只跑檢查與建置，不部署。
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 刻意鎖版本；Rust 版本鎖在 rust-toolchain.toml，升級前先確認全書範例都通過。
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          # deps 是第二部 crate 範例共用的依賴 package，checkcode 會在這裡的 target 編譯。
          workspaces: |
            tools/checkcode
            tools/checkcode/deps

      - name: Install mdBook
        run: |
          curl -sSL --fail "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin

      - name: Check Rust examples
        run: cargo run --release --manifest-path tools/checkcode/Cargo.toml -- zh-TW/src

      - name: Build book
        working-directory: zh-TW
        run: |
          mdbook build
          (cd src && zip -r ../book/rust-book-src.zip .)

      - name: Assemble site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -r zh-TW/book public/zh-TW

      - if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
